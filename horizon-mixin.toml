[mod]
id = "scguns"
version = "0.1.0"
priority = 100

# O commit do Horizon em que este mod foi testado (Nightly 2026-11-08, fdc87ae).
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "port_scguns"
source = "runtime.rs"

[[injection]]
id = "server-tick"
kind = "HEAD"
hook = "server_tick"
hook_version = 1
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "register-commands"
kind = "HEAD"
hook = "register_commands"
hook_version = 1
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "perform-command"
kind = "HEAD"
hook = "perform_command"
hook_version = 1
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "listed"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "be"
kind = "HEAD"
hook = "block_entity"
hook_version = 1
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "be-ticks"
kind = "HEAD"
hook = "block_entity_ticks"
hook_version = 1
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "be-container"
kind = "HEAD"
hook = "block_entity_container"
hook_version = 1
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "be-tick"
kind = "HEAD"
hook = "block_entity_tick"
hook_version = 1
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "screen"
kind = "HEAD"
hook = "screen"
hook_version = 1
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<crate::game::native_hooks::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
kind = "HEAD"
hook = "screen_draw"
hook_version = 1
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "slot-rules"
kind = "HEAD"
hook = "menu_slot_rules"
hook_version = 1
helper = "menu_slot_rules.rs"
bindings = [
  { name = "menu", ty = "&str", value = "menu" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "may_place", ty = "&mut bool", value = "&mut *may_place" },
  { name = "max_stack", ty = "&mut u32", value = "&mut *max_stack" },
]
